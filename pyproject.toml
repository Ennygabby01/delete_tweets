[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv.pre-migration", "output", ".memory"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
